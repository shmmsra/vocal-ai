# vocal-ai — manual model-export + HuggingFace Hub publish pipeline.
#
# Exports every ONNX/.npy artifact from export/ (including T3), gates the result on the
# FULL parity suite (`make test-py-parity`, not `test-py-parity-ci` -- i.e. including the
# heavy_build/T3 check ADR-0007 excludes from the always-on parity.yml gate), structurally
# validates every file (no inference, see scripts/smoke_test_artifact.py), then publishes
# to the public HuggingFace Hub repo. See
# docs/decisions/0013-hf-hub-model-distribution-and-release-packaging.md for the full
# rationale, including why running T3's export+parity here is safe despite ADR-0007: this
# job only runs on manual trigger, on a public-repo ubuntu-latest runner (4-core/16GB RAM),
# well above the ~9GB peak that excluded T3 from the always-on per-push gate.
#
# Deliberately NOT triggered by export/** pushes: publishing model weights to a public
# repo is a deliberate, externally-visible action, and this is the heaviest job in the
# whole pipeline -- not something that should fire automatically on every touch to
# export/ (including e.g. a test-only edit). Instead (VAI-016), it fires on a push to
# main that touches the root MODELS_VERSION file -- i.e. a deliberate version bump --
# plus workflow_dispatch for manual/debug runs. A leading guard job skips the rest of
# the pipeline if a `models-vN` tag for the current MODELS_VERSION already exists (e.g.
# the file changed but its value didn't, or the workflow re-ran), so it's safe even
# though the path filter alone can't tell content changes from no-op edits.

name: Publish model artifacts

on:
  push:
    branches: [main]
    paths: ["MODELS_VERSION"]
  workflow_dispatch:
    inputs:
      with_voice_cloning:
        description: "Also export ve.onnx/s3tokenizer.onnx (needed for --voice cloning)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  check-version:
    name: Check whether MODELS_VERSION was actually bumped
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare MODELS_VERSION against existing tags
        id: check
        run: |
          VERSION=$(tr -d '[:space:]' < MODELS_VERSION)
          TAG="models-v$VERSION"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "MODELS_VERSION is $VERSION, but tag $TAG already exists -- nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "MODELS_VERSION is $VERSION, tag $TAG does not exist yet -- publishing." >> "$GITHUB_STEP_SUMMARY"
          fi

  export-and-publish:
    name: Export ONNX/npy artifacts, verify parity, publish to HF Hub
    needs: check-version
    if: github.event_name == 'workflow_dispatch' || needs.check-version.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        # Same reasoning as parity.yml's step: this job downloads the full Chatterbox
        # checkpoint (~1-2GB) and produces every .onnx/.npy artifact (several GB total),
        # on top of the export/ toolchain (torch, transformers, diffusers, gradio).
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python export/ dependencies
        # `make export` shells out to scripts/export-all.sh, which hard-requires a real venv at
        # export/.venv/bin/python (matching docs/dev-setup.md §2's local setup) rather than
        # falling back to the system interpreter -- so create that venv here instead of installing
        # into the runner's global Python.
        run: |
          python -m venv export/.venv
          export/.venv/bin/pip install -r export/requirements.txt

      - name: Export model artifacts
        run: |
          if [ "${{ inputs.with_voice_cloning }}" = "true" ]; then
            make export ARGS=--with-voice-cloning
          else
            make export
          fi

      - name: Full ONNX-vs-PyTorch parity gate (including T3 -- see ADR-0013)
        run: make test-py-parity

      - name: Structural smoke test (no inference -- file validation only)
        run: export/.venv/bin/python scripts/smoke_test_artifact.py --models-dir models

      - name: Publish to HuggingFace Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          export/.venv/bin/python scripts/publish_models.py \
            --repo-id shmmsra/vocal-ai-models \
            --models-dir models \
            --hf-tag "${{ needs.check-version.outputs.tag_name }}"

      - name: Tag this models version (record-keeping, matches the HF Hub tag above)
        if: github.event_name == 'push'
        run: |
          git tag "${{ needs.check-version.outputs.tag_name }}"
          git push origin "${{ needs.check-version.outputs.tag_name }}"
