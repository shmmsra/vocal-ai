# vocal-ai — per-platform release build + packaging (Milestone 7 / VAI-007).
#
# Builds vocalai-cli for macOS (CoreML) + Windows/Linux (CPU-only for now -- CUDA/cuDNN
# bundling is deferred to VAI-015, see
# docs/decisions/0013-hf-hub-model-distribution-and-release-packaging.md). Downloads the
# already-published model artifacts from the public HuggingFace Hub repo
# (models-export.yml publishes them separately, on its own manual trigger) to
# structurally validate them (no ONNX inference, no session -- file validation only,
# see scripts/smoke_test_artifact.py) -- but does NOT bundle them into the release
# asset: GitHub Releases caps assets at 2GiB/file, and the model set (~4GB) doesn't fit.
# The release asset is binary-only; end users fetch models separately via
# scripts/install.sh|install.ps1 (see README.md), which downloads them straight from the
# public HF repo -- no HF token needed, it's a public, anonymously-readable repo. See
# ADR-0013's addendum for the full story of why this changed from the original
# bundle-everything design. Real end-to-end audio validation is a manual step -- see
# docs/manual-testing.md.
#
# Triggers: a `v*` tag (also cuts a real GitHub Release), a push to main that bumps the
# workspace package version in Cargo.toml (VAI-016 -- same effect as a `v*` tag push, minus
# a human having to push the tag by hand; a leading job resolves the version and skips the
# rest of the pipeline if a matching `vX.Y.Z` tag already exists), or workflow_dispatch
# (build + upload a workflow artifact for inspection, without publishing a release).

name: Release build

on:
  push:
    # `paths` only applies to the `branches` match, not the `tags` one: GitHub skips path
    # filtering entirely for a newly-created ref (which every tag push is, by definition),
    # so a manual `git tag vX.Y.Z && git push` still runs unconditionally as before --
    # `paths: ["Cargo.toml"]` only gates the new main-push path (VAI-016).
    tags: ["v*"]
    branches: [main]
    paths: ["Cargo.toml"]
  workflow_dispatch:
    inputs:
      hf_revision:
        description: "HuggingFace Hub revision to bundle (branch, tag, or commit SHA)"
        type: string
        default: main

env:
  HF_REPO_ID: shmmsra/vocal-ai-models

# Explicit, least-privilege permission for the auto-provided GITHUB_TOKEN --
# softprops/action-gh-release needs `contents: write` to create a release and upload
# assets. Declared here rather than relying on the repo's "Workflow permissions" default
# (Settings -> Actions -> General), which defaults to read-only on many repos and 403s
# otherwise ("Resource not accessible by integration").
permissions:
  contents: write

jobs:
  resolve-release:
    name: Resolve whether this run should cut a real release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.resolve.outputs.should_release }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version/tag and whether to release
        id: resolve
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # Direct `v*` tag push (manual, unchanged from before VAI-016): always release.
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            TAG="v$VERSION"
            echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "Cargo.toml's workspace version is $VERSION, but tag $TAG already exists -- nothing to release." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "Cargo.toml's workspace version is $VERSION, tag $TAG does not exist yet -- releasing." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            # workflow_dispatch: build + validate only, matching the existing dry-run behavior.
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "tag_name=" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build + package (${{ matrix.artifact_name }})
    needs: resolve-release
    if: github.event_name == 'workflow_dispatch' || needs.resolve-release.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: vocalai-macos
            cargo_features: --features vocalai-cli/coreml
            binary_name: vocalai
          - os: windows-latest
            artifact_name: vocalai-windows-cpu
            cargo_features: ""
            binary_name: vocalai.exe
          - os: ubuntu-latest
            artifact_name: vocalai-linux-cpu
            cargo_features: ""
            binary_name: vocalai
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release -p vocalai-cli ${{ matrix.cargo_features }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packaging/smoke-test dependencies
        run: pip install -r scripts/requirements.txt

      - name: Resolve HuggingFace Hub revision
        id: hf
        shell: bash
        run: |
          REVISION="${{ inputs.hf_revision }}"
          if [ -z "$REVISION" ]; then REVISION="main"; fi
          SHA=$(python -c "from huggingface_hub import HfApi; print(HfApi().model_info('${{ env.HF_REPO_ID }}', revision='$REVISION').sha)")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Bundling ${{ env.HF_REPO_ID }}@$SHA (revision: $REVISION)" >> "$GITHUB_STEP_SUMMARY"

      - name: Download model artifacts from HuggingFace Hub (validation only, not bundled)
        # Downloaded to a location outside dist/<artifact_name>/ on purpose -- these are
        # never archived into the release asset (see the file header comment). Only used
        # below to structurally validate that this release's pinned HF revision is sound.
        shell: bash
        run: |
          python -c "
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='${{ env.HF_REPO_ID }}',
              revision='${{ steps.hf.outputs.sha }}',
              local_dir='dist/models-validate',
          )
          "

      - name: Stage bundle (binary + licenses only -- see file header comment)
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.artifact_name }}
          cp target/release/${{ matrix.binary_name }} dist/${{ matrix.artifact_name }}/
          cp THIRD_PARTY_LICENSES dist/${{ matrix.artifact_name }}/
          cp LICENSE dist/${{ matrix.artifact_name }}/

      - name: Structural smoke test (no inference)
        shell: bash
        run: |
          python scripts/smoke_test_artifact.py \
            --models-dir dist/models-validate \
            --binary dist/${{ matrix.artifact_name }}/${{ matrix.binary_name }} \
            --extra-file dist/${{ matrix.artifact_name }}/THIRD_PARTY_LICENSES \
            --extra-file dist/${{ matrix.artifact_name }}/LICENSE

      - name: Archive bundle (zip)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/${{ matrix.artifact_name }}/* -DestinationPath dist/${{ matrix.artifact_name }}.zip

      - name: Archive bundle (tar.gz)
        if: runner.os != 'Windows'
        run: tar -C dist/${{ matrix.artifact_name }} -czf dist/${{ matrix.artifact_name }}.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          # A single glob, not separate .zip/.tar.gz lines -- each OS only ever produces
          # one of the two, and an explicit line for the one that doesn't exist logs a
          # (harmless, but noisy) "Pattern ... does not match any files" warning.
          path: dist/${{ matrix.artifact_name }}.*
          if-no-files-found: error

      - name: Upload release asset
        if: needs.resolve-release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-release.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/${{ matrix.artifact_name }}.*
