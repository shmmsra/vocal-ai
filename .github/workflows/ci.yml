# vocal-ai CI — mirrors `make check` exactly.
#
# Whatever the local pre-commit gate runs, CI runs the same thing on Linux.
# Drift between local and CI erodes the gate's authority — don't let them diverge.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Pre-commit gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free disk space
        # `ubuntu-latest` ships ~30GB of preinstalled toolchains (.NET, Android SDK,
        # GHC, CodeQL, ...) we never use. The export/ toolchain (torch, diffusers,
        # transformers, gradio) plus HuggingFace checkpoints downloaded fresh every
        # run (ve.safetensors + s3gen.safetensors + t3_cfg.safetensors, the latter
        # alone ~2GB) plus their exported .onnx artifacts (t3_decoder.onnx alone
        # ~1.9GB) are enough to exhaust the runner's remaining disk mid-run — this
        # reclaims headroom before any of that happens (standard GitHub Actions
        # idiom for disk-constrained jobs).
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # No `cache: 'pip'`: the export/ toolchain (torch, diffusers, transformers,
          # gradio, ...) plus the exported .onnx files and HuggingFace checkpoints
          # written during parity-check tests fill the runner's ephemeral disk enough
          # that the post-job pip-cache-save step fails with "No space left on
          # device" (non-fatal to the gate itself, but noisy). Not worth chasing —
          # this install isn't the slow part of the job.

      - name: Install Python export/ dependencies
        run: pip install -r export/requirements.txt

      # ── The actual gate ──────────────────────────────────────────────────────
      - name: Run make check
        run: make check
