# vocal-ai CI — fast gate: lint/fmt/clippy + Rust tests + Python tests that don't
# need a real checkpoint download.
#
# Split from the heavier real-checkpoint parity checks (see parity.yml) — see
# docs/decisions/0006-split-ci-into-fast-and-parity-workflows.md for why. Both
# workflows run on the same triggers (every push/PR to main); together they cover
# what `make check` covers locally. Nothing is skipped, just organized into two
# jobs so a fast, cheap, offline gate isn't coupled to a slow, multi-GB-download,
# memory-heavy one.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Pre-commit gate (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # No `cache: 'pip'`: see parity.yml's "Free disk space" step comment —
          # same disk-tight-runner reasoning applies to this job's pip install too.

      - name: Install Python export/ dependencies
        run: pip install -r export/requirements.txt

      - name: Install Python scripts/ dependencies
        run: pip install -r scripts/requirements.txt

      # ── The actual gate ──────────────────────────────────────────────────────
      - name: fmt + clippy + Rust tests
        run: |
          make fmt-check
          make clippy
          make test-rs

      - name: Python tests (no checkpoint download)
        run: make test-py-fast

      - name: scripts/ tests (no checkpoint download, no network, no inference)
        run: make test-scripts
