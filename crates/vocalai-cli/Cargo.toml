[package]
name = "vocalai-cli"
version.workspace = true
edition = "2021"
license = "MIT"

[[bin]]
name = "vocalai"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
indicatif = "0.17"
rand = "0.8"
vocalai-core = { path = "../vocalai-core" }

[features]
default = []
coreml = ["vocalai-core/coreml"]
cuda = ["vocalai-core/cuda"]
