[pytest]
markers =
    parity: downloads a real HuggingFace checkpoint and runs a full PyTorch-vs-ONNX
        numerical parity check (see export/parity_check.py). Heavy: multi-GB
        downloads, real model forwards. Run via `make test-py-parity`; excluded
        from `make test-py-fast` (see .github/workflows/ci.yml vs parity.yml).
    heavy_build: a `parity` test whose *first-time export* (not just verifying an
        already-built .onnx) needs more memory than a free-tier CI runner has
        (measured ~9GB peak for T3's decoder-with-past trace — see
        docs/decisions/0007-exclude-t3-parity-from-ci.md). Runs locally via
        `make test-py-parity`; excluded from CI's `make test-py-parity-ci`.
