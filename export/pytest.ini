[pytest]
markers =
    parity: downloads a real HuggingFace checkpoint and runs a full PyTorch-vs-ONNX
        numerical parity check (see export/parity_check.py). Heavy: multi-GB
        downloads, real model forwards. Run via `make test-py-parity`; excluded
        from `make test-py-fast` (see .github/workflows/ci.yml vs parity.yml).
